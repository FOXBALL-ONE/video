spring:
  application:
    name: video
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/shopmall}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:postgres}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # update=开发自动建表 / validate=生产校验 / none
      ddl-auto: "${DB_DDL:update}"
    open-in-view: false