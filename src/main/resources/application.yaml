spring:
  application:
    name: video
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/shopmall}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:change-me}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # update=开发自动建表 / validate=生产校验 / none
      ddl-auto: "${DB_DDL:update}"
    open-in-view: false
  servlet:
    multipart:
      max-file-size: "${FILE_MAX_SIZE:100MB}"
      max-request-size: "${FILE_MAX_REQUEST_SIZE:2GB}"
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD:}"

file:
  storage-path: "${FILE_STORAGE_PATH:./storage}"
  base-url: "${FILE_BASE_URL:http://localhost:8080}"
  signing-secret: "${FILE_SIGNING_SECRET:replace-with-a-long-random-secret}"
  download-token-ttl-seconds: "${FILE_DOWNLOAD_TTL_SECONDS:300}"
  max-batch-size: "${FILE_MAX_BATCH_SIZE:20}"
  max-file-size-bytes: "${FILE_MAX_SIZE_BYTES:104857600}"
  signing:
    public-ttl-seconds: "${FILE_PUBLIC_TTL_SECONDS:60}"
    user-ttl-seconds: "${FILE_USER_TTL_SECONDS:300}"
    admin-ttl-seconds: "${FILE_ADMIN_TTL_SECONDS:180}"
    order-ttl-seconds: "${FILE_ORDER_TTL_SECONDS:300}"

auth:
  jwt:
    secret: "${JWT_SECRET:replace-with-a-long-random-secret-at-least-32-bytes}"
    ttl-seconds: "${JWT_TTL_SECONDS:3600}"
  test-admin:
    enabled: "${AUTH_TEST_ADMIN_ENABLED:false}"
    token: "${AUTH_TEST_ADMIN_TOKEN:test-admin-token}"
    username: "${AUTH_TEST_ADMIN_USERNAME:test-admin}"
    email: "${AUTH_TEST_ADMIN_EMAIL:test-admin@localhost}"
    password: "${AUTH_TEST_ADMIN_PASSWORD:admin}"

ai:
  client:
    model-catalog-ttl: "${AI_MODEL_CATALOG_TTL:10m}"
    default-profile:
      proxy-mode: "${AI_PROXY_MODE:DIRECT}"
      proxy-host: "${AI_PROXY_HOST:}"
      proxy-port: "${AI_PROXY_PORT:0}"
      proxy-username: "${AI_PROXY_USERNAME:}"
      proxy-password: "${AI_PROXY_PASSWORD:}"
      dns-mode: "${AI_DNS_MODE:LOCAL}"
      allow-private-network: "${AI_ALLOW_PRIVATE_NETWORK:false}"
      connect-timeout: "${AI_CONNECT_TIMEOUT:10s}"
      response-timeout: "${AI_RESPONSE_TIMEOUT:90s}"
